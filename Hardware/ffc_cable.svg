<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">

  <rect width="780" height="430" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="600" fill="#1a1a1a">
    10-pin FFC, 0.5 mm pitch, 25-50 mm, reverse
  </text>
  <text x="24" y="56" font-size="13" fill="#555">
    Contacts sit on opposite faces at the two ends. Controller J4 to load board J1.
  </text>

  <!-- ══ TOP VIEW ══════════════════════════════════════════════════════ -->
  <text x="24" y="92" font-size="12" font-weight="600" fill="#777" letter-spacing="1">TOP VIEW</text>

  <!-- laminate -->
  <rect x="110" y="104" width="540" height="80" fill="#e9dfc3" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- conductors running the length, faint (they are inside the laminate) -->
  <g stroke="#b8925a" stroke-width="1" opacity="0.55">
    <line x1="155" y1="108" x2="605" y2="108"/><line x1="155" y1="116" x2="605" y2="116"/>
    <line x1="155" y1="124" x2="605" y2="124"/><line x1="155" y1="132" x2="605" y2="132"/>
    <line x1="155" y1="140" x2="605" y2="140"/><line x1="155" y1="148" x2="605" y2="148"/>
    <line x1="155" y1="156" x2="605" y2="156"/><line x1="155" y1="164" x2="605" y2="164"/>
    <line x1="155" y1="172" x2="605" y2="172"/><line x1="155" y1="180" x2="605" y2="180"/>
  </g>

  <!-- left end: exposed contacts facing the viewer -->
  <g fill="#c8a02c">
    <rect x="114" y="105.5" width="40" height="5"/><rect x="114" y="113.5" width="40" height="5"/>
    <rect x="114" y="121.5" width="40" height="5"/><rect x="114" y="129.5" width="40" height="5"/>
    <rect x="114" y="137.5" width="40" height="5"/><rect x="114" y="145.5" width="40" height="5"/>
    <rect x="114" y="153.5" width="40" height="5"/><rect x="114" y="161.5" width="40" height="5"/>
    <rect x="114" y="169.5" width="40" height="5"/><rect x="114" y="177.5" width="40" height="5"/>
  </g>
  <line x1="155" y1="104" x2="155" y2="184" stroke="#2b2b2b" stroke-width="1"/>

  <!-- right end: stiffener is what you see, contacts are on the far face -->
  <rect x="605" y="104" width="45" height="80" fill="#3a5f8a" opacity="0.85"
        stroke="#2b2b2b" stroke-width="1"/>
  <g stroke="#c8a02c" stroke-width="1" stroke-dasharray="3 3" opacity="0.9">
    <line x1="609" y1="108" x2="646" y2="108"/><line x1="609" y1="116" x2="646" y2="116"/>
    <line x1="609" y1="124" x2="646" y2="124"/><line x1="609" y1="132" x2="646" y2="132"/>
    <line x1="609" y1="140" x2="646" y2="140"/><line x1="609" y1="148" x2="646" y2="148"/>
    <line x1="609" y1="156" x2="646" y2="156"/><line x1="609" y1="164" x2="646" y2="164"/>
    <line x1="609" y1="172" x2="646" y2="172"/><line x1="609" y1="180" x2="646" y2="180"/>
  </g>

  <!-- conductor count -->
  <text x="380" y="99" font-size="11" fill="#777" text-anchor="middle">10 conductors, 0.5 mm pitch</text>

  <text x="134" y="200" font-size="11" fill="#1a1a1a" text-anchor="middle">contacts</text>
  <text x="134" y="212" font-size="11" fill="#1a1a1a" text-anchor="middle">this face</text>
  <text x="627" y="200" font-size="11" fill="#1a1a1a" text-anchor="middle">stiffener</text>
  <text x="627" y="212" font-size="11" fill="#1a1a1a" text-anchor="middle">(contacts behind)</text>

  <!-- overall length dimension -->
  <g stroke="#666" stroke-width="1">
    <line x1="110" y1="232" x2="650" y2="232"/>
    <line x1="110" y1="226" x2="110" y2="238"/>
    <line x1="650" y1="226" x2="650" y2="238"/>
  </g>
  <rect x="338" y="222" width="84" height="18" fill="#ffffff"/>
  <text x="380" y="236" font-size="12" fill="#1a1a1a" text-anchor="middle">25-50 mm</text>

  <!-- ══ SIDE VIEW ═════════════════════════════════════════════════════ -->
  <text x="24" y="288" font-size="12" font-weight="600" fill="#777" letter-spacing="1">SIDE VIEW</text>

  <rect x="110" y="312" width="540" height="10" fill="#e9dfc3" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- left end: contacts up, stiffener down -->
  <rect x="114" y="306" width="40" height="6" fill="#c8a02c" stroke="#2b2b2b" stroke-width="0.8"/>
  <rect x="114" y="322" width="40" height="5" fill="#3a5f8a" stroke="#2b2b2b" stroke-width="0.8"/>

  <!-- right end: contacts down, stiffener up -->
  <rect x="606" y="322" width="40" height="6" fill="#c8a02c" stroke="#2b2b2b" stroke-width="0.8"/>
  <rect x="606" y="307" width="40" height="5" fill="#3a5f8a" stroke="#2b2b2b" stroke-width="0.8"/>

  <!-- leaders -->
  <g stroke="#666" stroke-width="1">
    <line x1="134" y1="306" x2="134" y2="286"/>
    <line x1="626" y1="328" x2="626" y2="350"/>
  </g>
  <text x="134" y="280" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">contacts UP</text>
  <text x="626" y="364" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">contacts DOWN</text>

  <!-- legend -->
  <rect x="110" y="386" width="14" height="10" fill="#c8a02c" stroke="#2b2b2b" stroke-width="0.8"/>
  <text x="130" y="395" font-size="12" fill="#1a1a1a">exposed contacts</text>
  <rect x="268" y="386" width="14" height="10" fill="#3a5f8a" stroke="#2b2b2b" stroke-width="0.8"/>
  <text x="288" y="395" font-size="12" fill="#1a1a1a">stiffener</text>
  <rect x="380" y="386" width="14" height="10" fill="#e9dfc3" stroke="#2b2b2b" stroke-width="0.8"/>
  <text x="400" y="395" font-size="12" fill="#1a1a1a">laminate</text>

  <text x="110" y="418" font-size="11" fill="#777">
    A same-side cable cannot make contact at one end.
  </text>

</svg>
