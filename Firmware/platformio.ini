[env:genericCH32V003F4P6]
platform = ch32v
board = genericCH32V003F4P6
framework = ch32v003fun
monitor_speed = 115200
upload_protocol = wch-link

; Bring-up environment for the digital LED path (WS2812 on PC6 / J4 pin 10).
; Keeps the default env — and therefore the RGBW devices — untouched.
[env:ws2812_test]
extends = env:genericCH32V003F4P6
build_flags =
    -DEVG_MODE_WS2812
    -DWS2812_NUM_LEDS=5
