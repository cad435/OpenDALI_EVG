; One environment per EVG configuration, so a build is never ambiguous.
;
; The mode is passed explicitly as -DEVG_MODE_xxx. hardware.h only falls back to
; RGBW when no mode is defined at all (see the guard at hardware.h:55), so an
; explicit flag here always wins and the environment name alone tells you what
; the binary is.
;
;   pio run                            build default_envs only
;   pio run -e EVG_WS2812B             build one configuration
;   pio run -e EVG_WS2812B -t upload   build + flash one configuration
;
; A bare `pio run -t upload` used to flash *every* environment in turn, leaving
; whichever came last on the chip — hence default_envs below.

[platformio]
default_envs = EVG_RGBW

; Shared by every environment below.
[env]
platform = ch32v
board = genericCH32V003F4P6
framework = ch32v003fun
monitor_speed = 115200
upload_protocol = wch-link

; ── PWM configurations (TIM1) ──────────────────────────────────────────────

[env:EVG_ONOFF]
build_flags = -DEVG_MODE_ONOFF

[env:EVG_SINGLE]
build_flags = -DEVG_MODE_SINGLE

[env:EVG_CCT]
build_flags = -DEVG_MODE_CCT

[env:EVG_RGB]
build_flags = -DEVG_MODE_RGB

[env:EVG_RGBW]
build_flags = -DEVG_MODE_RGBW

; ── Digital LED configurations (SPI1 + DMA on PC6) ─────────────────────────

[env:EVG_WS2812B]
build_flags =
    -DEVG_MODE_WS2812
    ; Strip length defaults to WS2812_NUM_LEDS in hardware.h (30).
    ; Uncomment to match a shorter bench strip:
    ; -DWS2812_NUM_LEDS=5

[env:EVG_SK6812_RGB]
build_flags = -DEVG_MODE_SK6812_RGB

[env:EVG_SK6812_RGBW]
build_flags = -DEVG_MODE_SK6812_RGBW

; Older WS2811 strips usually expect RGB on the wire instead of GRB.
; Same protocol and same EVG mode ID as EVG_WS2812B, only the byte order differs.
[env:EVG_WS2811_RGB]
build_flags =
    -DEVG_MODE_WS2812
    -DWS2812_WIRE_ORDER_RGB=1
