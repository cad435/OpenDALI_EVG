; DALI Bootloader Emergency Flasher — CH32V003
;
; A throw-away firmware whose only job is to replace the DALI bootloader in
; the CH32V003 BOOT area (0x1FFFF000). It is deployed over the DALI bus like
; any normal firmware update, does its job, and is then overwritten by the
; regular application firmware.
;
; The bootloader binary is NOT transferred over the bus — embed_bootloader.py
; compiles it straight into this image from ../Bootloader (see README.md).

[env:genericCH32V003F4P6]
platform = ch32v
board = genericCH32V003F4P6
framework = ch32v003fun
monitor_speed = 115200
upload_protocol = wch-link

; Generates src/bl_image.h from the sibling Bootloader project's .bin
extra_scripts = pre:embed_bootloader.py
